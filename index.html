<!DOCTYPE html>
<html lang="en" data-webtui-theme="catppuccin-mocha">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // applies the saved theme before the first paint, the list matches src/composables/useTheme.ts
      try {
        const theme = JSON.parse(localStorage.getItem('tui.theme'))
        const themes = [
          'catppuccin-mocha',
          'catppuccin-macchiato',
          'catppuccin-frappe',
          'catppuccin-latte',
        ]
        if (themes.includes(theme)) document.documentElement.dataset.webtuiTheme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
